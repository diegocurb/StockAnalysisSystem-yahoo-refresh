<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Head content remains unchanged -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Companies - Historical Stock Comparison</title>
    <style>
        /* CSS styles remain unchanged */
        /* Global styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            width: 80%;
            height: 80vh;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            border-right: 2px solid #ddd;
        }

        .sidebar h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            border-bottom: 1px solid #ecf0f1;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar ul li {
            margin: 12px 0;
            padding: 12px;
            background-color: #34495e;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .sidebar ul li:hover {
            background-color: #1abc9c;
        }

        .content {
            flex: 1;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .content h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .selected {
            background-color: #1abc9c !important;
        }

        button {
            background-color: #1abc9c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }

        button:hover {
            background-color: #16a085;
        }

        #results {
            margin-top: 30px;
            padding: 20px;
            background-color: #ecf0f1;
            border-radius: 5px;
        }

        #results h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        /* Smaller text for results */
        .company-results {
            font-size: 14px;
            margin-bottom: 20px;
        }

        .company-results p {
            margin: 4px 0;
        }

        .company-results strong {
            font-size: 16px;
        }

        #data-source {
            padding: 8px;
            margin: 0 0 8px 8px;
            max-width: 100%;
        }

        #source-status {
            font-size: 14px;
            line-height: 1.5;
            color: #52616f;
            margin-bottom: 18px;
        }

        #source-status p { margin: 5px 0; }
        details { margin-top: 12px; color: #52616f; font-size: 13px; }
        summary { cursor: pointer; }
        .result-cards { display: flex; flex-wrap: wrap; gap: 16px; }
        .result-cards .company-results { flex: 1; min-width: 180px; background: white; padding: 16px; border-radius: 8px; }
        .return-value { font-size: 26px; font-weight: 600; color: #177e70; margin: 10px 0 !important; }
        .sort-chart { width: 100%; height: auto; display: block; margin-bottom: 20px; }

        #source-status code {
            overflow-wrap: anywhere;
        }

        pre {
            background-color: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            margin: 20px 0;
            overflow-x: auto;
            font-size: 14px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                width: 100%;
                height: auto;
            }

            .sidebar {
                width: 100%;
                margin-bottom: 20px;
            }

            .content {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>Companies</h2>
        <ul id="company-list">
            <!-- Company list will be dynamically populated -->
        </ul>
    </aside>

    <!-- Content Section -->
    <main class="content">
        <h1>Compare Companies</h1>
        <p>Select two companies from the sidebar to compare.</p>
        <label for="data-source">Data source:</label>
        <select id="data-source">
            <option value="original">Saved data</option>
            <option value="yahoo">Yahoo Finance</option>
        </select>
        <div id="source-status" role="status" aria-live="polite"></div>
        <div id="comparison">
            <h3>Selected Companies:</h3>
            <p id="selected1">Company 1: None</p>
            <p id="selected2">Company 2: None</p>
            <button id="compareBtn" disabled>Compare</button>
        </div>
        <div id="results" aria-live="polite">
            <!-- Results will be dynamically populated here -->
        </div>
    </main>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const originalCompanies = [
            { name: "Adobe", id: "dataa/adobe.csv" },
            { name: "Amazon", id: "dataa/amazon.csv" },
            { name: "AMD", id: "dataa/amd.csv" },
            { name: "ASML", id: "dataa/asml.csv" },
            { name: "Business Machines", id: "dataa/businessmachines.csv" },
            { name: "Cisco", id: "dataa/cisco.csv" },
            { name: "CRM", id: "dataa/crm.csv" },
            { name: "Disney", id: "dataa/disney.csv" },
            { name: "Facebook", id: "dataa/facebook.csv" },
            { name: "Google", id: "dataa/google.csv" },
            { name: "HP", id: "dataa/hp.csv" },
            { name: "Intel", id: "dataa/intel.csv" },
            { name: "Lyft", id: "dataa/lyft.csv" },
            { name: "Meta", id: "dataa/meta.csv" },
            { name: "Microsoft", id: "dataa/microsoft.csv" },
            { name: "Netflix", id: "dataa/netflix.csv" },
            { name: "NVIDIA", id: "dataa/nvidia.csv" },
            { name: "Oracle", id: "dataa/oracle.csv" },
            { name: "Tesla", id: "dataa/tesla.csv" },
            { name: "Twitter", id: "dataa/twitter.csv" },
            { name: "Zoom", id: "dataa/zoom.csv" }
        ];

        const companyList = document.getElementById('company-list');
        const selected1 = document.getElementById('selected1');
        const selected2 = document.getElementById('selected2');
        const compareBtn = document.getElementById('compareBtn');
        const resultsDiv = document.getElementById('results');
        const sourceSelect = document.getElementById('data-source');
        const sourceStatus = document.getElementById('source-status');

        let selectedCompanies = [];
        let busy = false;
        let generation = 0;
        let requestController = null;

        function clearResults() {
            resultsDiv.replaceChildren();
        }

        function updateSelection() {
            selected1.textContent = `Company 1: ${selectedCompanies[0]?.name || 'None'}`;
            selected2.textContent = `Company 2: ${selectedCompanies[1]?.name || 'None'}`;
            compareBtn.disabled = busy || selectedCompanies.length !== 2;
        }

        function populateCompanies(companies) {
            companyList.replaceChildren();
            companies.forEach(company => {
                const listItem = document.createElement('li');
                listItem.textContent = company.name;
                listItem.dataset.id = company.id;
                listItem.addEventListener('click', () => {
                    if (busy) return;
                    if (selectedCompanies.includes(company)) {
                        selectedCompanies = selectedCompanies.filter(c => c !== company);
                        listItem.classList.remove('selected');
                    } else if (selectedCompanies.length < 2) {
                        selectedCompanies.push(company);
                        listItem.classList.add('selected');
                    }
                    clearResults();
                    updateSelection();
                });
                companyList.appendChild(listItem);
            });
        }

        function addText(parent, text, tag = 'p') {
            const element = document.createElement(tag);
            element.textContent = text;
            parent.appendChild(element);
            return element;
        }

        function addRefreshInstructions() {
            const details = document.createElement('details');
            addText(details, 'How to update prices', 'summary');
            addText(details, 'Run this in the project folder, then reload this page:');
            addText(details, 'python scripts/refresh_yahoo.py --tickers AMZN MSFT --period 1y', 'code');
            sourceStatus.appendChild(details);
        }

        function friendlyDate(value, includeTime = false) {
            if (!value) return 'Unavailable';
            const date = new Date(includeTime ? value : value + 'T12:00:00');
            if (Number.isNaN(date.getTime())) return value;
            return includeTime ? date.toLocaleString(undefined, {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})
                : date.toLocaleDateString(undefined, {month:'short',day:'numeric',year:'numeric'});
        }

        async function readResponse(response) {
            const text = await response.text();
            let data;
            try { data = JSON.parse(text); } catch (_) { /* Show readable backend text below. */ }
            if (!response.ok) {
                throw new Error(data?.error || text || `Request failed (${response.status}).`);
            }
            if (!data || typeof data !== 'object') throw new Error('The server returned an unreadable response.');
            return data;
        }

        async function changeSource() {
            const currentGeneration = ++generation;
            if (requestController) requestController.abort();
            requestController = null;
            busy = false;
            selectedCompanies = [];
            clearResults();
            updateSelection();
            sourceStatus.replaceChildren();
            companyList.replaceChildren();
            if (sourceSelect.value === 'original') {
                populateCompanies(originalCompanies);
                addText(sourceStatus, 'Compare the original saved datasets.');
                return;
            }

            busy = true;
            updateSelection();
            addText(sourceStatus, 'Loading Yahoo prices…');
            const controller = new AbortController();
            requestController = controller;
            try {
                const response = await fetch('http://localhost:8000/yahoo-history', { signal: controller.signal });
                const manifest = await readResponse(response);
                if (currentGeneration !== generation) return;
                const seenFiles = new Set();
                const companies = (Array.isArray(manifest.datasets) ? manifest.datasets : [])
                    .filter(item => {
                        if (typeof item.file !== 'string' || !item.file || seenFiles.has(item.file)) return false;
                        seenFiles.add(item.file);
                        return true;
                    })
                    .map(item => {
                        const names = {AMZN:'Amazon', MSFT:'Microsoft', AAPL:'Apple', NVDA:'NVIDIA', GOOGL:'Google', GOOG:'Google', META:'Meta', TSLA:'Tesla', AMD:'AMD', ADBE:'Adobe', NFLX:'Netflix'};
                        return {name: names[item.symbol] ? `${names[item.symbol]} (${item.symbol})` : String(item.name || item.symbol || item.file), id:item.file};
                    });
                populateCompanies(companies);
                sourceStatus.replaceChildren();
                const dates = (manifest.datasets || []).map(item => item.as_of).filter(Boolean).sort();
                addText(sourceStatus, companies.length
                    ? `Yahoo Finance · Prices through ${friendlyDate(dates[0])} · Updated ${friendlyDate(manifest.fetched_at_utc, true)}`
                    : 'No Yahoo prices downloaded yet.');
                if (companies.length) addText(sourceStatus, 'Daily price history. Prices may be delayed.');
                addRefreshInstructions();
            } catch (error) {
                if (currentGeneration !== generation || error.name === 'AbortError') return;
                sourceStatus.replaceChildren();
                addText(sourceStatus, 'Yahoo prices are unavailable. Update your download to get started.');
                addRefreshInstructions();
            } finally {
                if (currentGeneration === generation) {
                    busy = false;
                    requestController = null;
                    updateSelection();
                }
            }
        }

        sourceSelect.addEventListener('change', changeSource);
        changeSource();

        compareBtn.addEventListener('click', async () => {
            if (busy || selectedCompanies.length !== 2) return;
            const selection = selectedCompanies.slice();
            const currentGeneration = generation;
            busy = true;
            updateSelection();
            clearResults();
            const loadingMessage = addText(resultsDiv, 'Loading comparison…');
            const controller = new AbortController();
            requestController = controller;

            try {
                const response = await fetch('http://localhost:8000/compare', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ file1: selection[0].id, file2: selection[1].id }),
                    signal: controller.signal
                });
                const data = await readResponse(response);
                if (currentGeneration !== generation) return;
                displayResults(data, selection);
            } catch (error) {
                if (currentGeneration !== generation || error.name === 'AbortError') return;
                clearResults();
                addText(resultsDiv, `Could not compare these companies: ${error.message}`);
            } finally {
                loadingMessage.remove();
                if (currentGeneration === generation) {
                    busy = false;
                    requestController = null;
                    updateSelection();
                }
            }
        });

        function displayResults(data, selection) {
            const dataKeys = Object.keys(data);
            function findDataKey(filePath) {
                return dataKeys.find(key => key.replace(/\\/g, '/').endsWith(filePath));
            }
            const company1Key = findDataKey(selection[0].id);
            const company2Key = findDataKey(selection[1].id);
            if (!company1Key || !company2Key) throw new Error('Results for a selected company were missing.');
            const company1Data = data[company1Key];
            const company2Data = data[company2Key];
            clearResults();
            addText(resultsDiv, 'Comparison', 'h3');
            displaySortTimesChart(company1Data, company2Data, selection);
            const cards = document.createElement('div');
            cards.className = 'result-cards';
            resultsDiv.appendChild(cards);
            renderCompany(selection[0], company1Data, cards);
            renderCompany(selection[1], company2Data, cards);
            addText(resultsDiv, 'Historical performance; not a prediction.');
        }

        function formatNumber(value) {
            return typeof value === 'number' && Number.isFinite(value) ? value.toFixed(4) : 'N/A';
        }

        function renderCompany(company, data, parent) {
            const section = document.createElement('div');
            section.className = 'company-results';
            parent.appendChild(section);
            addText(section, company.name, 'strong');
            const priceReturn = typeof data.total_return === 'number' ? `${data.total_return >= 0 ? '+' : ''}${data.total_return.toFixed(2)}%` : 'N/A';
            addText(section, priceReturn).className = 'return-value';
            addText(section, 'Price return');
            addText(section, `Daily Sharpe: ${typeof data.sharpe_ratio === 'number' ? data.sharpe_ratio.toFixed(3) : 'N/A'}`);
            const info = data.data_info || {};
            addText(section, `${friendlyDate(info.first_date)} – ${friendlyDate(info.as_of)}`);
            const details = document.createElement('details');
            addText(details, 'Data details', 'summary');
            addText(details, `Source: ${info.source || 'Saved data'}`);
            if (info.fetched_at_utc) addText(details, `Updated: ${friendlyDate(info.fetched_at_utc, true)}`);
            if (info.rows != null) addText(details, `${info.rows} daily prices`);
            if (info.price_basis) addText(details, `Price basis: ${info.price_basis}`);
            addText(details, 'Daily Sharpe uses an assumed annual risk-free rate of 1.5%. Price return excludes dividends.');
            if (info.delay_note) addText(details, String(info.delay_note));
            section.appendChild(details);
        }

        function displaySortTimesChart(company1Data, company2Data, selection) {
            addText(resultsDiv, 'Sorting time · Lower is faster', 'h4');
            const ns = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(ns, 'svg');
            svg.setAttribute('viewBox', '0 0 640 280');
            svg.setAttribute('role', 'img');
            svg.setAttribute('aria-label', 'Heap sort and merge sort times in milliseconds for the two selected companies');
            svg.id = 'sort-times-chart';
            svg.classList.add('sort-chart');
            resultsDiv.appendChild(svg);
            function draw(tag, attrs, text) {
                const element = document.createElementNS(ns, tag);
                Object.entries(attrs).forEach(([key, value]) => element.setAttribute(key, value));
                if (text != null) element.textContent = text;
                svg.appendChild(element);
                return element;
            }
            const times = [company1Data, company2Data].map(data =>
                [data.heap_sort_time_ms, data.merge_sort_time_ms].map(value =>
                    typeof value === 'number' && Number.isFinite(value) && value >= 0 ? value : 0));
            const ceiling = Math.max(...times.flat(), 0.0001) * 1.25;
            const colors = ['#149b8a', '#4e79bc'];
            draw('text', {x:64,y:18,fill:'#52616f','font-size':12}, 'Milliseconds');
            for (let tick = 0; tick <= 4; tick++) {
                const y = 210 - tick * 42;
                draw('line', {x1:64,y1:y,x2:620,y2:y,stroke:'#d5dfe4'});
                draw('text', {x:56,y:y+4,'text-anchor':'end',fill:'#52616f','font-size':11},
                    tick ? Number((ceiling * tick / 4).toPrecision(3)).toString() : '0');
            }
            ['Heap sort', 'Merge sort'].forEach((label, group) => {
                const center = 200 + group * 280;
                draw('text', {x:center,y:232,'text-anchor':'middle',fill:'#2c3e50','font-size':13}, label);
                times.forEach((values, company) => {
                    const value = values[group];
                    const height = value / ceiling * 168;
                    const x = center - 52 + company * 58;
                    const bar = draw('rect', {x,y:210-height,width:46,height,rx:3,fill:colors[company],'data-time-ms':value});
                    const tooltip = document.createElementNS(ns, 'title');
                    tooltip.textContent = `${selection[company].name}: ${value.toFixed(4)} ms`;
                    bar.appendChild(tooltip);
                    draw('text', {x:x+23,y:204-height,'text-anchor':'middle',fill:'#2c3e50','font-size':11}, value.toFixed(4));
                });
            });
            selection.forEach((company, index) => {
                const x = 70 + index * 280;
                draw('rect', {x,y:253,width:12,height:12,rx:2,fill:colors[index]});
                draw('text', {x:x+20,y:264,fill:'#2c3e50','font-size':12}, company.name);
            });
        }
    });
</script>

</body>
</html>
