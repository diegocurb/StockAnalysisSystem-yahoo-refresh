<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Head content remains unchanged -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Companies - Historical Stock Comparison</title>
    <!-- Added back the Chart.js script for the graph -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* CSS styles remain unchanged */
        /* Global styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            width: 80%;
            height: 80vh;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            border-right: 2px solid #ddd;
        }

        .sidebar h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            border-bottom: 1px solid #ecf0f1;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar ul li {
            margin: 12px 0;
            padding: 12px;
            background-color: #34495e;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .sidebar ul li:hover {
            background-color: #1abc9c;
        }

        .content {
            flex: 1;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .content h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .selected {
            background-color: #1abc9c !important;
        }

        button {
            background-color: #1abc9c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }

        button:hover {
            background-color: #16a085;
        }

        #results {
            margin-top: 30px;
            padding: 20px;
            background-color: #ecf0f1;
            border-radius: 5px;
        }

        #results h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        /* Smaller text for results */
        .company-results {
            font-size: 14px;
            margin-bottom: 20px;
        }

        .company-results p {
            margin: 4px 0;
        }

        .company-results strong {
            font-size: 16px;
        }

        #data-source {
            padding: 8px;
            margin: 0 0 8px 8px;
            max-width: 100%;
        }

        #source-status {
            font-size: 14px;
            line-height: 1.5;
        }

        #source-status code {
            overflow-wrap: anywhere;
        }

        pre {
            background-color: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            margin: 20px 0;
            overflow-x: auto;
            font-size: 14px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                width: 100%;
                height: auto;
            }

            .sidebar {
                width: 100%;
                margin-bottom: 20px;
            }

            .content {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>Companies</h2>
        <ul id="company-list">
            <!-- Company list will be dynamically populated -->
        </ul>
    </aside>

    <!-- Content Section -->
    <main class="content">
        <h1>Compare Companies</h1>
        <p>Select two companies from the sidebar to compare.</p>
        <label for="data-source">Data source:</label>
        <select id="data-source">
            <option value="original">Original saved CSV files</option>
            <option value="yahoo">Refreshed Yahoo daily history</option>
        </select>
        <div id="source-status" role="status" aria-live="polite"></div>
        <div id="comparison">
            <h3>Selected Companies:</h3>
            <p id="selected1">Company 1: None</p>
            <p id="selected2">Company 2: None</p>
            <button id="compareBtn" disabled>Compare</button>
        </div>
        <div id="results" aria-live="polite">
            <!-- Results will be dynamically populated here -->
        </div>
    </main>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const originalCompanies = [
            { name: "Adobe", id: "dataa/adobe.csv" },
            { name: "Amazon", id: "dataa/amazon.csv" },
            { name: "AMD", id: "dataa/amd.csv" },
            { name: "ASML", id: "dataa/asml.csv" },
            { name: "Business Machines", id: "dataa/businessmachines.csv" },
            { name: "Cisco", id: "dataa/cisco.csv" },
            { name: "CRM", id: "dataa/crm.csv" },
            { name: "Disney", id: "dataa/disney.csv" },
            { name: "Facebook", id: "dataa/facebook.csv" },
            { name: "Google", id: "dataa/google.csv" },
            { name: "HP", id: "dataa/hp.csv" },
            { name: "Intel", id: "dataa/intel.csv" },
            { name: "Lyft", id: "dataa/lyft.csv" },
            { name: "Meta", id: "dataa/meta.csv" },
            { name: "Microsoft", id: "dataa/microsoft.csv" },
            { name: "Netflix", id: "dataa/netflix.csv" },
            { name: "NVIDIA", id: "dataa/nvidia.csv" },
            { name: "Oracle", id: "dataa/oracle.csv" },
            { name: "Tesla", id: "dataa/tesla.csv" },
            { name: "Twitter", id: "dataa/twitter.csv" },
            { name: "Zoom", id: "dataa/zoom.csv" }
        ];

        const companyList = document.getElementById('company-list');
        const selected1 = document.getElementById('selected1');
        const selected2 = document.getElementById('selected2');
        const compareBtn = document.getElementById('compareBtn');
        const resultsDiv = document.getElementById('results');
        const sourceSelect = document.getElementById('data-source');
        const sourceStatus = document.getElementById('source-status');

        let selectedCompanies = [];
        let busy = false;
        let generation = 0;
        let requestController = null;
        let sortChart = null;

        function clearResults() {
            if (sortChart) {
                sortChart.destroy();
                sortChart = null;
            }
            resultsDiv.replaceChildren();
        }

        function updateSelection() {
            selected1.textContent = `Company 1: ${selectedCompanies[0]?.name || 'None'}`;
            selected2.textContent = `Company 2: ${selectedCompanies[1]?.name || 'None'}`;
            compareBtn.disabled = busy || selectedCompanies.length !== 2;
        }

        function populateCompanies(companies) {
            companyList.replaceChildren();
            companies.forEach(company => {
                const listItem = document.createElement('li');
                listItem.textContent = company.name;
                listItem.dataset.id = company.id;
                listItem.addEventListener('click', () => {
                    if (busy) return;
                    if (selectedCompanies.includes(company)) {
                        selectedCompanies = selectedCompanies.filter(c => c !== company);
                        listItem.classList.remove('selected');
                    } else if (selectedCompanies.length < 2) {
                        selectedCompanies.push(company);
                        listItem.classList.add('selected');
                    }
                    clearResults();
                    updateSelection();
                });
                companyList.appendChild(listItem);
            });
        }

        function addText(parent, text, tag = 'p') {
            const element = document.createElement(tag);
            element.textContent = text;
            parent.appendChild(element);
            return element;
        }

        function addRefreshInstructions() {
            addText(sourceStatus, 'To fetch the latest available daily history, run this in the project folder:');
            addText(sourceStatus, 'python scripts/refresh_yahoo.py --tickers AMZN MSFT --period 1y', 'code');
            addText(sourceStatus, 'Then reload this page and select Refreshed Yahoo daily history. Existing downloaded history remains available when offline.');
        }

        async function readResponse(response) {
            const text = await response.text();
            let data;
            try { data = JSON.parse(text); } catch (_) { /* Show readable backend text below. */ }
            if (!response.ok) {
                throw new Error(data?.error || text || `Request failed (${response.status}).`);
            }
            if (!data || typeof data !== 'object') throw new Error('The server returned an unreadable response.');
            return data;
        }

        async function changeSource() {
            const currentGeneration = ++generation;
            if (requestController) requestController.abort();
            requestController = null;
            busy = false;
            selectedCompanies = [];
            clearResults();
            updateSelection();
            sourceStatus.replaceChildren();
            companyList.replaceChildren();
            if (sourceSelect.value === 'original') {
                populateCompanies(originalCompanies);
                addText(sourceStatus, 'Using the original saved datasets. These files are not refreshed by the Yahoo download command.');
                return;
            }

            busy = true;
            updateSelection();
            addText(sourceStatus, 'Loading saved Yahoo history…');
            const controller = new AbortController();
            requestController = controller;
            try {
                const response = await fetch('http://localhost:8000/yahoo-history', { signal: controller.signal });
                const manifest = await readResponse(response);
                if (currentGeneration !== generation) return;
                const seenFiles = new Set();
                const companies = (Array.isArray(manifest.datasets) ? manifest.datasets : [])
                    .filter(item => {
                        if (typeof item.file !== 'string' || !item.file || seenFiles.has(item.file)) return false;
                        seenFiles.add(item.file);
                        return true;
                    })
                    .map(item => ({ name: String(item.name || item.symbol || item.file), id: item.file }));
                populateCompanies(companies);
                sourceStatus.replaceChildren();
                addText(sourceStatus, companies.length
                    ? `Source: ${manifest.source || 'Yahoo Finance'}. Fetched (UTC): ${manifest.fetched_at_utc || 'Unavailable'}. Using saved daily history; comparison does not fetch new quotes.`
                    : 'No downloaded Yahoo datasets are available yet.');
                if (manifest.delay_note) addText(sourceStatus, String(manifest.delay_note));
                addRefreshInstructions();
            } catch (error) {
                if (currentGeneration !== generation || error.name === 'AbortError') return;
                sourceStatus.replaceChildren();
                addText(sourceStatus, `Yahoo history is unavailable: ${error.message}`);
                addRefreshInstructions();
            } finally {
                if (currentGeneration === generation) {
                    busy = false;
                    requestController = null;
                    updateSelection();
                }
            }
        }

        sourceSelect.addEventListener('change', changeSource);
        changeSource();

        compareBtn.addEventListener('click', async () => {
            if (busy || selectedCompanies.length !== 2) return;
            const selection = selectedCompanies.slice();
            const currentGeneration = generation;
            busy = true;
            updateSelection();
            clearResults();
            const loadingMessage = addText(resultsDiv, 'Loading comparison…');
            const controller = new AbortController();
            requestController = controller;

            try {
                const response = await fetch('http://localhost:8000/compare', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ file1: selection[0].id, file2: selection[1].id }),
                    signal: controller.signal
                });
                const data = await readResponse(response);
                if (currentGeneration !== generation) return;
                displayResults(data, selection);
            } catch (error) {
                if (currentGeneration !== generation || error.name === 'AbortError') return;
                clearResults();
                addText(resultsDiv, `Could not compare these companies: ${error.message}`);
            } finally {
                loadingMessage.remove();
                if (currentGeneration === generation) {
                    busy = false;
                    requestController = null;
                    updateSelection();
                }
            }
        });

        function displayResults(data, selection) {
            const dataKeys = Object.keys(data);
            function findDataKey(filePath) {
                return dataKeys.find(key => key.replace(/\\/g, '/').endsWith(filePath));
            }
            const company1Key = findDataKey(selection[0].id);
            const company2Key = findDataKey(selection[1].id);
            if (!company1Key || !company2Key) throw new Error('Results for a selected company were missing.');
            const company1Data = data[company1Key];
            const company2Data = data[company2Key];
            clearResults();
            addText(resultsDiv, 'Historical Comparison Results:', 'h3');
            renderCompany(selection[0], company1Data);
            renderCompany(selection[1], company2Data);
            addText(resultsDiv, 'These metrics describe past price movements over each displayed date range. They do not forecast future prices.');
            displaySortTimesChart(company1Data, company2Data, selection);
        }

        function formatNumber(value) {
            return typeof value === 'number' && Number.isFinite(value) ? value.toFixed(4) : 'N/A';
        }

        function renderCompany(company, data) {
            const section = document.createElement('div');
            section.className = 'company-results';
            resultsDiv.appendChild(section);
            addText(section, company.name, 'strong');
            addText(section, `Heap Sort Time (ms): ${formatNumber(data.heap_sort_time_ms)}`);
            addText(section, `Merge Sort Time (ms): ${formatNumber(data.merge_sort_time_ms)}`);
            addText(section, `Daily Sharpe (assumed annual risk-free 1.5%): ${formatNumber(data.sharpe_ratio)}`);
            addText(section, `Close price return (%): ${formatNumber(data.total_return)}`);
            const info = data.data_info || {};
            addText(section, `Source: ${info.source || 'Original saved CSV'}`);
            if (info.fetched_at_utc) addText(section, `Fetched (UTC): ${info.fetched_at_utc}`);
            addText(section, `Data as of: ${info.as_of || 'Unavailable'}`);
            addText(section, `Date range: ${info.first_date || 'Unavailable'} to ${info.as_of || 'Unavailable'}`);
            if (info.rows != null) addText(section, `Daily observations: ${info.rows}`);
            if (info.interval) addText(section, `Interval: ${info.interval}`);
            addText(section, `Price basis: ${info.price_basis || 'Raw closing price'}`);
            if (info.delay_note) addText(section, String(info.delay_note));
        }

        function displaySortTimesChart(company1Data, company2Data, selection) {
            if (typeof Chart === 'undefined') {
                addText(resultsDiv, 'The chart is unavailable. Sort timings are shown above.');
                return;
            }
            const canvas = document.createElement('canvas');
            resultsDiv.appendChild(canvas);
            const labels = ['Heap Sort Time (ms)', 'Merge Sort Time (ms)'];
            const data1 = [company1Data.heap_sort_time_ms, company1Data.merge_sort_time_ms];
            const data2 = [company2Data.heap_sort_time_ms, company2Data.merge_sort_time_ms];
            sortChart = new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: selection[0].name,
                            data: data1,
                            backgroundColor: 'rgba(75, 192, 192, 0.5)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 1
                        },
                        {
                            label: selection[1].name,
                            data: data2,
                            backgroundColor: 'rgba(255, 99, 132, 0.5)',
                            borderColor: 'rgba(255, 99, 132, 1)',
                            borderWidth: 1
                        }
                    ]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Time (ms)'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        tooltip: {
                            callbacks: {
                                title: function(context) {
                                    return context[0].label;
                                }
                            }
                        }
                    }
                }
            });
        }
    });
</script>

</body>
</html>
